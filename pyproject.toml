[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-app"
version = "1.0.0"
description = "Classifieur de sentiment d’avis clients en français"
readme = "README-PAQUET.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn==1.5.*", "joblib>=1.4", "numpy==1.26.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sentiment = "sentiment_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentiment_app"]

[tool.setuptools.package-data]
sentiment_app = ["modele/*.joblib"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["tp5-interface-kit", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*"]
ignore_missing_imports = true
