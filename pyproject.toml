# Configuration des outils de qualité (TP4). Le packaging (TP6) complétera ce fichier.

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# E4, E7, E9, F : erreurs probables ; I : ordre des imports ; B : constructions à risque
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["joblib", "joblib.*", "sklearn", "sklearn.*", "pandas", "pandas.*", "uvicorn", "uvicorn.*"]
ignore_missing_imports = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-app"
version = "1.0.0"
description = "Classification d'avis clients en français"
readme = "README-PAQUET.md"
requires-python = ">=3.11"
dependencies = ["scikit-learn==1.5.2", "joblib==1.4.2", "pandas==2.2.3", "fastapi==0.115.14", "uvicorn==0.30.6", "pydantic==2.9.2", "httpx==0.27.2", "streamlit==1.39.1", "python-dotenv==1.0.1"]

[project.scripts]
sentiment = "sentiment_app.cli:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["sentiment_app*", "api*", "ui*"]
exclude = ["tests*", "build*", "dist*"]

[tool.setuptools.package-data]
sentiment_app = ["modele/*.joblib", "web/*.html"]
