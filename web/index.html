<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analyse de sentiment</title>
  <style>
    body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 1rem system-ui; }
    label { display: grid; gap: .3rem; margin-bottom: 1rem; }
    input, textarea, button { font: inherit; padding: .45rem; }
    output { display: block; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Analyse de sentiment</h1>
  <form>
    <label>Adresse de l’API <input name="url" type="url" value="http://127.0.0.1:8000" required></label>
    <label>Clé client <input name="cle" type="password" autocomplete="off" required></label>
    <label>Avis <textarea name="texte" rows="4" maxlength="2000" required></textarea></label>
    <button>Analyser</button>
    <output aria-live="polite"></output>
  </form>
  <script type="module" src="app.mjs"></script>
</body>
</html>
